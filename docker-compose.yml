version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: learnnov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: learnnov_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "learnnov"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # M-13: Redis لا يحتاج port خارجي — الاتصال داخلي فقط عبر Docker network
    # لإضافة كلمة مرور في الإنتاج: command: redis-server --requirepass ${REDIS_PASSWORD}
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    # M-12: MongoDB لا يحتاج port خارجي — الاتصال داخلي فقط عبر Docker network
    # إزالة port mapping يمنع الوصول المباشر من خارج الحاوية
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  learnnov-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    # M-11: استخدام .env الفعلي وليس .env.example
    env_file:
      - ./learnnov-cloud/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://learnnov:${POSTGRES_PASSWORD}@db:5432/learnnov_db
      REDIS_URL: redis://redis:6379/0
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DB_NAME: learnnov
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./learnnov-cloud:/app
    ports:
      - "8000:8000"

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=2
    # M-11: استخدام .env الفعلي
    env_file:
      - ./learnnov-cloud/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://learnnov:${POSTGRES_PASSWORD}@db:5432/learnnov_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DB_NAME: learnnov
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./learnnov-cloud:/app
    restart: on-failure

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # M-11: استخدام .env الفعلي
    env_file:
      - ./learnnov-cloud/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://learnnov:${POSTGRES_PASSWORD}@db:5432/learnnov_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./learnnov-cloud:/app
    restart: on-failure


  learnnov-lms:
    # Official Open edX image – customize tag as required
    image: edxops/edxapp:latest
    env_file:
      - ./.env
    environment:
      SERVICE_VARIANT: lms
      LMS_HOST: 0.0.0.0
      CMS_HOST: 0.0.0.0
      DB_HOST: db
      DB_NAME: learnnov_db
      DB_USER: learnnov
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8001:8000"
    volumes:
      - ./learnnov-lms:/edx/app/edx-platform
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    restart: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - learnnov-cloud
      - learnnov-lms

volumes:
  pgdata:
  mongodata:
