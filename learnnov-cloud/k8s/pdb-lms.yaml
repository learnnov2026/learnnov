# =============================================================================
# Pod Disruption Budget (PDB) لـ LMS في منصة ليرن نوف
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: learnnov-lms-pdb
  namespace: learnnov
  labels:
    app.kubernetes.io/name: learnnov
    app.kubernetes.io/component: lms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: lms
