# =============================================================================
# خدمة LMS لمنصة ليرن نوف
# خدمة من نوع ClusterIP لتوجيه حركة المرور الداخلية إلى بودات LMS
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: learnnov-lms-service
  namespace: learnnov
  labels:
    app.kubernetes.io/name: learnnov
    app.kubernetes.io/component: lms
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # تفعيل تجميع نقاط النهاية لـ GKE Ingress
    cloud.google.com/neg: '{"ingress": true}'
    description: "خدمة داخلية لتوجيه الطلبات إلى منصة LMS"
spec:
  type: ClusterIP
  selector:
    # اختيار بودات LMS
    app.kubernetes.io/name: learnnov
    app.kubernetes.io/component: lms
  ports:
    - name: http
      # المنفذ الذي تستمع عليه الخدمة
      port: 80
      # المنفذ الهدف في حاوية LMS
      targetPort: 8000
      protocol: TCP
